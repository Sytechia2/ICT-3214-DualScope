# DualScope dashboard theme (scripts/incident_dashboard.py). Run Streamlit from the repository root.

[server]
enableStaticServing = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[[theme.fontFaces]]
family = "public-sans"
url = "app/static/fonts/PublicSans-Variable.ttf"
style = "normal"

[[theme.fontFaces]]
family = "public-sans"
url = "app/static/fonts/PublicSans-Italic-Variable.ttf"
style = "italic"

[[theme.fontFaces]]
family = "jetbrains-mono"
url = "app/static/fonts/JetBrainsMono-Variable.ttf"
style = "normal"

[theme]
base = "light"
font = "public-sans"
headingFont = "public-sans"
codeFont = "jetbrains-mono"
baseFontSize = 16
primaryColor = "#13707A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F7"
textColor = "#17262B"
linkColor = "#13707A"
borderColor = "#DDE3E5"
dataframeBorderColor = "#DDE3E5"
dataframeHeaderBackgroundColor = "#F4F6F7"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
redColor = "#D2452B"
orangeColor = "#D99A1E"
greenColor = "#2E8B57"
blueColor = "#13707A"
grayColor = "#7A8B90"
chartCategoricalColors = ["#13707A", "#D2452B", "#D99A1E", "#7A8B90", "#0E3B43"]

[theme.sidebar]
backgroundColor = "#0E3B43"
secondaryBackgroundColor = "#164B53"
textColor = "#E8F1F2"
primaryColor = "#7FD1CF"
borderColor = "#24606A"
